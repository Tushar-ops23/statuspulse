#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - ufw
  - fail2ban

write_files:
  - path: /etc/ssh/sshd_config.d/hardened.conf
    content: |
      Port 2222
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/cron.d/statuspulse-monitor
    content: |
      */5 * * * * root /home/deploy/statuspulse/scripts/health-monitor.sh

  - path: /etc/cron.d/statuspulse-backup
    content: |
      0 2 * * * root /home/deploy/statuspulse/scripts/backup.sh

runcmd:
  # Configure firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 2222/tcp comment 'Custom SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw --force enable

  # Configure swap (1GB)
  - fallocate -l 1G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Install Docker
  - curl -fsSL https://get.docker.com | bash
  - systemctl enable docker
  - systemctl start docker

  # Install Docker Compose plugin
  - apt-get install -y docker-compose-plugin

  # Create deploy user
  - useradd -m -s /bin/bash -G docker deploy
  - mkdir -p /home/deploy/.ssh
  - cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - chown -R deploy:deploy /home/deploy/.ssh
  - chmod 700 /home/deploy/.ssh
  - chmod 600 /home/deploy/.ssh/authorized_keys

  # Create app directories
  - mkdir -p /home/deploy/statuspulse
  - mkdir -p /backups/postgres
  - mkdir -p /var/log
  - chown -R deploy:deploy /home/deploy/statuspulse
  - chown -R deploy:deploy /backups

  # Restart SSH with new config
  - systemctl restart sshd
