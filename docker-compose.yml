version: '3.8'

services:
  app:
    build: .
    image: statuspulse:latest
    container_name: statuspulse-app
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - statuspulse-network
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:15-alpine
    container_name: statuspulse-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statuspulse-network
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: statuspulse-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statuspulse-network
    deploy:
      resources:
        limits:
          memory: 128M

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: statuspulse-monitor
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - statuspulse-network
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: statuspulse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - statuspulse-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  statuspulse-network:
    driver: bridge

volumes:
  postgres_data:
  uptime_kuma_data:
  caddy_data:
  caddy_config:
