name: Deploy

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            # Create app directory if not exists
            mkdir -p /home/${{ secrets.SERVER_USER }}/statuspulse
            cd /home/${{ secrets.SERVER_USER }}/statuspulse
            
            # Initial clone if directory is empty
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi
            
            export IMAGE_TAG=${{ github.sha }}
            export IMAGE_NAME=ghcr.io/${{ env.REPO_LOWER }}
            bash scripts/deploy.sh

      - name: Send Notification
        if: always()
        run: |
          curl -H "Title: StatusPulse Deployment" \
               -H "Priority: high" \
               -H "Tags: rocket,${{ job.status }}" \
               -d "Deployment ${{ job.status }} for commit ${{ github.sha }}" \
               ${{ secrets.ALERT_WEBHOOK_URL }}
